# ==============================================================================
# Edufyi HR Panel - High-Performance Apache VirtualHost Configuration
# ==============================================================================

# 1. Port 80 HTTP -> Single-Hop 301 Canonical HTTPS Redirect
<VirtualHost *:80>
    ServerName empoyee.edufyitechsolutions.com
    ServerAlias www.empoyee.edufyitechsolutions.com

    RewriteEngine On
    # FIX 1: Eliminate double redirect by mapping directly to target HTTPS domain
    RewriteRule ^ https://empoyee.edufyitechsolutions.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

# 2. Port 443 HTTPS VirtualHost
<VirtualHost *:443>
    ServerName empoyee.edufyitechsolutions.com
    ServerAlias www.empoyee.edufyitechsolutions.com

    # FIX 2: Enable HTTP/2 Protocol Multiplexing
    <IfModule mod_http2.c>
        Protocols h2 h2c http/1.1
    </IfModule>

    # Connection Optimization & Keep-Alive
    KeepAlive On
    MaxKeepAliveRequests 1000
    KeepAliveTimeout 65

    # SSL Configuration (Webuzo / Certbot manages these directives)
    # SSLEngine on
    # SSLCertificateFile /path/to/fullchain.pem
    # SSLCertificateKeyFile /path/to/privkey.pem

    RewriteEngine On

    # Canonical redirect for www.empoyee... -> empoyee...
    RewriteCond %{HTTP_HOST} ^www\.empoyee\.edufyitechsolutions\.com$ [NC]
    RewriteRule ^ https://empoyee.edufyitechsolutions.com%{REQUEST_URI} [R=301,L]

    # FIX 7: Brotli & Gzip Compression
    <IfModule mod_brotli.c>
        AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml text/css text/javascript
        AddOutputFilterByType BROTLI_COMPRESS application/javascript application/x-javascript
        AddOutputFilterByType BROTLI_COMPRESS application/json application/xml application/xhtml+xml
        AddOutputFilterByType BROTLI_COMPRESS image/svg+xml font/woff2 application/font-woff2
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml text/css text/javascript
        AddOutputFilterByType DEFLATE application/javascript application/x-javascript
        AddOutputFilterByType DEFLATE application/json application/xml application/xhtml+xml
        AddOutputFilterByType DEFLATE image/svg+xml font/woff2 application/font-woff2
    </IfModule>

    # FIX 5: Static Asset Caching Headers
    <IfModule mod_headers.c>
        # 1-Year Immutable Caching for fingerprinted assets, fonts, brand logos
        <LocationMatch "\.(js|css|woff2|woff|ttf|png|jpg|jpeg|gif|webp|ico|svg)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>

        # Root HTML: Always revalidate
        <LocationMatch "(/|index\.html)$">
            Header set Cache-Control "no-cache, no-store, must-revalidate"
            Header set Pragma "no-cache"
            Header set Expires "0"
        </LocationMatch>
    </IfModule>

    # SSE (Server-Sent Events) live updates streaming settings
    SetEnvIf Request_URI "^/api/v1/events" is_sse=1
    <IfModule mod_env.c>
        SetEnvIf Request_URI "^/api/v1/events" no-gzip=1
        SetEnvIf Request_URI "^/api/v1/events" dont-vary=1
    </IfModule>
    <IfModule mod_proxy.c>
        SetEnvIf Request_URI "^/api/v1/events" proxy-nokeepalive=1
        SetEnvIf Request_URI "^/api/v1/events" proxy-sendchunked=1
    </IfModule>

    # Reverse Proxy to Node.js backend (Port 30006)
    <IfModule mod_proxy.c>
        ProxyPreserveHost On
        ProxyPass / http://localhost:30006/ connectiontimeout=10 timeout=300
        ProxyPassReverse / http://localhost:30006/
    </IfModule>

    # Error & Access Logs
    # ErrorLog ${APACHE_LOG_DIR}/edufyi_error.log
    # CustomLog ${APACHE_LOG_DIR}/edufyi_access.log combined
</VirtualHost>

