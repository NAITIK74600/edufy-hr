# ==============================================================================
# Edufyi HR Panel - High-Performance Nginx Server Configuration
# ==============================================================================

# 1. Upstream Node.js application server with connection keep-alive
upstream edufyi_node_backend {
    server 127.0.0.1:30006;
    keepalive 64; # Reuses TCP connections between Nginx and Node
}

# 2. HTTP Server -> Single-Hop 301 Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name empoyee.edufyitechsolutions.com www.empoyee.edufyitechsolutions.com;

    # FIX 1: Single-hop 301 canonical redirect directly to secure domain
    return 301 https://empoyee.edufyitechsolutions.com$request_uri;
}

# 3. HTTPS Server -> HTTP/2, Caching, Brotli/Gzip Compression & Proxying
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # FIX 2: HTTP/2 enabled (multiplexing, zero connection queuing)
    http2 on; # For Nginx 1.25.1+. For older Nginx versions: use "listen 443 ssl http2;"

    # Optional HTTP/3 (QUIC) support (requires Nginx built with ngx_http_v3_module)
    # listen 443 quic reuseport;
    # listen [::]:443 quic reuseport;
    # add_header Alt-Svc 'h3=":443"; ma=86400';

    server_name empoyee.edufyitechsolutions.com;

    # SSL Certificates (update paths to match your server certs)
    # ssl_certificate /etc/letsencrypt/live/empoyee.edufyitechsolutions.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/empoyee.edufyitechsolutions.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;
    # ssl_session_tickets off;

    # Canonical redirect if accessed via www over HTTPS
    if ($host = 'www.empoyee.edufyitechsolutions.com') {
        return 301 https://empoyee.edufyitechsolutions.com$request_uri;
    }

    # FIX 7: Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # FIX 7 (Optional): Brotli Compression (if ngx_brotli module is installed)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml image/svg+xml font/woff2;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Client upload limit (matches app payload limit)
    client_max_body_size 30M;

    # Root directory for static assets (if serving directly or fallthrough)
    # root /home/username/public_html;

    # FIX 5: Long-term Immutable Caching for fingerprinted Vite assets & fonts
    location ~* ^/(assets|fonts)/ {
        proxy_pass http://edufyi_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Brand Logo & Static Public Images
    location ~* \.(png|jpg|jpeg|gif|ico|webp|svg|woff2|woff)$ {
        proxy_pass http://edufyi_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML entry point -> Always revalidate
    location = /index.html {
        proxy_pass http://edufyi_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Server-Sent Events (SSE) live updates streaming
    location /api/v1/events {
        proxy_pass http://edufyi_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # Default proxy pass to Node.js backend
    location / {
        proxy_pass http://edufyi_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

